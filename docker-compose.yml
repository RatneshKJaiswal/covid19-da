networks:
  spark-cluster-net:
    driver: bridge

services:
  spark-master:
    build: .
    image: spark-cluster-covid19:latest
    container_name: spark-master
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --ip spark-master --port 7077 --webui-port 8080
    ports:
      - "8080:8080"   # Spark Master Web UI
      - "7077:7077"   # Spark Master RPC
    volumes:
      - ./:/opt/workspace
    networks:
      - spark-cluster-net

  spark-worker-1:
    image: spark-cluster-covid19:latest
    container_name: spark-worker-1
    hostname: spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 2 --memory 2G --webui-port 8081
    ports:
      - "8081:8081"   # Worker 1 Web UI
    volumes:
      - ./:/opt/workspace
    depends_on:
      - spark-master
    networks:
      - spark-cluster-net

  spark-worker-2:
    image: spark-cluster-covid19:latest
    container_name: spark-worker-2
    hostname: spark-worker-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 2 --memory 2G --webui-port 8081
    ports:
      - "8082:8081"   # Worker 2 Web UI (mapped to host port 8082)
    volumes:
      - ./:/opt/workspace
    depends_on:
      - spark-master
    networks:
      - spark-cluster-net
